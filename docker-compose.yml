version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fitcore-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fitcore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitcore-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/fitcore
      - JWT_SECRET=fitcore_production_super_secret_jwt_key_2025
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - fitcore-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitcore-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - fitcore-network

volumes:
  mongodb_data:

networks:
  fitcore-network:
    driver: bridge
